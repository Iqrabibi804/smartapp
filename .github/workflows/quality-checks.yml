name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Reconcile lockfile with backend manifest
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Enforce zero dependency vulnerabilities
        working-directory: backend
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Full dependency audit:', a.metadata?.vulnerabilities); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, '|', v.severity, '| direct:', v.isDirect, '| fix:', JSON.stringify(v.fixAvailable)); if ((a.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1)"
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Check JavaScript syntax
        run: find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

  flutter:
    name: Flutter tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Build Flutter web release
        working-directory: mobile
        run: flutter build web --release
