name: Refresh vulnerable backend dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Update compatible backend security fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Update vulnerable direct dependencies within existing semver ranges
        working-directory: backend
        run: npm update mongoose morgan multer express
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Require a clean production dependency audit
        working-directory: backend
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Production audit:', a.metadata?.vulnerabilities); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, JSON.stringify(v.fixAvailable)); if ((a.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1)"
      - name: Commit updated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
          else
            git commit -m "fix(deps): refresh vulnerable backend dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
