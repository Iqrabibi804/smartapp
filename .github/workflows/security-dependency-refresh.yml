name: Refresh vulnerable backend dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: backend-dependency-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Apply compatible backend security fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Apply non-breaking npm security fixes
        working-directory: backend
        run: npm audit fix
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Require a clean production dependency audit
        working-directory: backend
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Production audit:', a.metadata?.vulnerabilities); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, JSON.stringify(v.fixAvailable)); if ((a.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1)"
      - name: Commit updated lockfile to the pull request branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
          else
            git commit -m "fix(deps): refresh vulnerable backend dependencies"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload audit report when refresh fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-npm-audit-report
          path: backend/npm-audit.json
          if-no-files-found: ignore
