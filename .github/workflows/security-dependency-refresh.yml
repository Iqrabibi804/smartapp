name: Refresh vulnerable backend dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: backend-dependency-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Apply compatible backend security fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Reconcile lockfile with backend manifest
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Update vulnerable packages within declared version ranges
        working-directory: backend
        run: npm update express qs minimatch || true
      - name: Apply remaining non-breaking npm security fixes
        working-directory: backend
        run: npm audit fix || true
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Generate full dependency audit
        working-directory: backend
        run: npm audit --json > npm-audit-full.json || true
      - name: Generate production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Commit compatible lockfile updates to the pull request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile changes were produced."
          else
            git commit -m "fix(deps): refresh compatible backend dependencies"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Enforce zero production vulnerabilities
        working-directory: backend
        run: |
          node -e "const a=require('./npm-audit-production.json'); console.log('Production audit:', a.metadata?.vulnerabilities); if ((a.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1)"
      - name: Report all dependency vulnerabilities
        working-directory: backend
        run: |
          node -e "const a=require('./npm-audit-full.json'); console.log('Full dependency audit:', a.metadata?.vulnerabilities); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, JSON.stringify(v.fixAvailable))"
      - name: Upload dependency audit reports
        if: always() && hashFiles('backend/npm-audit-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit-reports
          path: backend/npm-audit-*.json
          if-no-files-found: error
