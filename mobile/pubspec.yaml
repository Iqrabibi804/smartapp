name: smartmap_ai
description: "SmartMap AI — Intelligent Location Discovery, Navigation & Recommendation Platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Secure token storage (never store JWT in plain SharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Onboarding / splash / maps
  smooth_page_indicator: ^1.1.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  connectivity_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  socket_io_client: ^2.0.2
  telephony: ^0.2.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
